name: Android UI smoke and QA release

on:
  workflow_run:
    workflows: ["Build VremyaHodom Android"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  ui-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download verified APK from source build
        uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and validate Material navigation on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            PACKAGE='app.humanrouter'
            ACTIVITY='app.humanrouter/.MainActivity'
            APK=$(find android-ci -type f -name 'app-debug.apk' -print -quit)
            test -n "$APK"
            test -s "$APK"

            mkdir -p ui-smoke
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb logcat -c >/dev/null 2>&1 || true

            adb install -r "$APK"
            adb shell pm clear "$PACKAGE" >/dev/null
            adb shell pm grant "$PACKAGE" android.permission.ACCESS_COARSE_LOCATION >/dev/null 2>&1 || true
            adb shell pm grant "$PACKAGE" android.permission.ACCESS_FINE_LOCATION >/dev/null 2>&1 || true
            adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS >/dev/null 2>&1 || true

            START_OUTPUT=$(adb shell am start -W -n "$ACTIVITY")
            printf '%s\n' "$START_OUTPUT" | tee ui-smoke/start.txt
            grep -F 'Status: ok' ui-smoke/start.txt
            sleep 6

            adb exec-out screencap -p > ui-smoke/home.png
            test -s ui-smoke/home.png
            adb shell uiautomator dump /sdcard/vremyahodom-window.xml >/dev/null
            adb pull /sdcard/vremyahodom-window.xml ui-smoke/window.xml >/dev/null
            adb shell wm size | tee ui-smoke/screen-size.txt
            adb shell wm density | tee ui-smoke/screen-density.txt

            grep -F 'Карта' ui-smoke/window.xml
            grep -F 'Маршруты' ui-smoke/window.xml
            grep -F 'Транспорт' ui-smoke/window.xml
            grep -F 'Избранное' ui-smoke/window.xml

            python - <<'PY'
            import re
            import xml.etree.ElementTree as ET
            from pathlib import Path

            xml_path = Path('ui-smoke/window.xml')
            root = ET.parse(xml_path).getroot()
            size_text = Path('ui-smoke/screen-size.txt').read_text(encoding='utf-8')
            matches = re.findall(r'(\d+)x(\d+)', size_text)
            if not matches:
                raise SystemExit('Unable to determine emulator screen size')
            screen_w, screen_h = map(int, matches[-1])

            labels = ('Карта', 'Маршруты', 'Транспорт', 'Избранное')
            centres = []
            for label in labels:
                candidates = []
                for node in root.iter('node'):
                    if node.attrib.get('text') == label or node.attrib.get('content-desc') == label:
                        bounds = node.attrib.get('bounds', '')
                        match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', bounds)
                        if match:
                            x1, y1, x2, y2 = map(int, match.groups())
                            candidates.append((x1, y1, x2, y2))
                if not candidates:
                    raise SystemExit(f'Missing navigation destination in accessibility tree: {label}')
                x1, y1, x2, y2 = max(candidates, key=lambda b: b[3])
                if y1 < screen_h * 0.70 or y2 > screen_h:
                    raise SystemExit(f'Navigation destination is outside expected bottom band: {label} {x1,y1,x2,y2}')
                centres.append(((x1 + x2) / 2, (y1 + y2) / 2))

            vertical_spread = max(y for _, y in centres) - min(y for _, y in centres)
            if vertical_spread > screen_h * 0.04:
                raise SystemExit(f'Navigation destinations are vertically misaligned: spread={vertical_spread}')

            horizontal = [x for x, _ in centres]
            if horizontal != sorted(horizontal):
                raise SystemExit(f'Navigation destinations are not ordered left-to-right: {horizontal}')

            print(f'Material navigation geometry OK: screen={screen_w}x{screen_h}, centres={centres}')
            PY

            adb shell dumpsys activity activities | grep -F "$PACKAGE/.MainActivity"
            if adb logcat -d -v brief | grep -A 15 'FATAL EXCEPTION' | grep -F "$PACKAGE"; then
              echo 'Fatal VremyaHodom exception detected in emulator logcat' >&2
              exit 1
            fi

      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vremyahodom-ui-smoke-api-35
          path: ui-smoke
          if-no-files-found: error
          retention-days: 90

  publish-qa-release:
    needs: ui-smoke
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified APK from source build
        uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish permanent QA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          VERSION="0.1.${SOURCE_RUN_NUMBER}"
          TAG="qa-v${VERSION}"
          APK_SRC=$(find android-ci -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK_SRC"
          test -s "$APK_SRC"

          APK_OUT="VremyaHodom-${VERSION}-qa.apk"
          SHA_OUT="VremyaHodom-${VERSION}-qa.sha256.txt"
          cp "$APK_SRC" "$APK_OUT"
          sha256sum "$APK_OUT" > "$SHA_OUT"

          cat > release-notes.txt <<EOF
          VremyaHodom QA build ${VERSION}

          Source commit: ${SOURCE_SHA}
          GitHub Actions build: ${SOURCE_RUN_ID}
          Build/unit/lint/APK verification: success
          Android API 35 UI smoke: success
          Navigation: Material 3 NavigationBar (Compose)
          Signing: CI debug signer (QA, not production signing)
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" "$SHA_OUT" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          else
            gh release create "$TAG" "$APK_OUT" "$SHA_OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          fi
