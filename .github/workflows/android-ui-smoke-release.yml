name: Android UI smoke and QA release

on:
  workflow_run:
    workflows: ["Build VremyaHodom Android"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  ui-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download verified APK from source build
        uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare UI smoke evidence
        shell: bash
        run: |
          mkdir -p ui-smoke
          printf 'workflow_run=%s\n' '${{ github.event.workflow_run.id }}' > ui-smoke/workflow.txt
          printf 'source_sha=%s\n' '${{ github.event.workflow_run.head_sha }}' >> ui-smoke/workflow.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and validate Material navigation on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash .github/scripts/android-ui-smoke.sh android-ci ui-smoke

      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vremyahodom-ui-smoke-api-35
          path: ui-smoke
          if-no-files-found: error
          retention-days: 90

  publish-qa-release:
    needs: ui-smoke
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified APK from source build
        uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish permanent QA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          VERSION="0.1.${SOURCE_RUN_NUMBER}"
          TAG="qa-v${VERSION}"
          APK_SRC=$(find android-ci -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK_SRC"
          test -s "$APK_SRC"

          APK_OUT="VremyaHodom-${VERSION}-qa.apk"
          SHA_OUT="VremyaHodom-${VERSION}-qa.sha256.txt"
          cp "$APK_SRC" "$APK_OUT"
          sha256sum "$APK_OUT" > "$SHA_OUT"

          cat > release-notes.txt <<EOF
          VremyaHodom QA build ${VERSION}

          Source commit: ${SOURCE_SHA}
          GitHub Actions build: ${SOURCE_RUN_ID}
          Build/unit/lint/APK verification: success
          Android API 35 UI smoke: success
          Navigation: Material 3 NavigationBar (Compose)
          Signing: CI debug signer (QA, not production signing)
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" "$SHA_OUT" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          else
            gh release create "$TAG" "$APK_OUT" "$SHA_OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          fi
