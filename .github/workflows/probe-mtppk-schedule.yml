name: Probe official MTPPK timetable sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/mtppk_schedule_probe.py'
      - 'tools/parse_mtppk_xlsx.py'
      - 'tools/mtppk_exception_probe.py'
      - '.github/workflows/probe-mtppk-schedule.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public MTPPK timetable downloads
        run: python tools/mtppk_schedule_probe.py
      - name: Parse captured XLSX timetables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mtppk-schedule-probe/parsed
          count=0
          for file in mtppk-schedule-probe/downloads/*.xlsx; do
            [ -e "$file" ] || continue
            base=$(basename "$file" .xlsx)
            python tools/parse_mtppk_xlsx.py "$file" \
              --output "mtppk-schedule-probe/parsed/${base}.json"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo 'No XLSX timetable was captured' >&2
            exit 1
          fi
          echo "Parsed $count MTPPK XLSX timetable files"
      - name: Capture timetable-change notices
        run: python tools/mtppk_exception_probe.py
      - name: Upload timetable probe
        uses: actions/upload-artifact@v4
        with:
          name: mtppk-schedule-probe
          path: mtppk-schedule-probe/
          if-no-files-found: error
