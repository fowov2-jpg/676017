name: Publish Human Router runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: runtime-v0.6.0
  push:
    paths:
      - incoming/**
      - manifest.json
      - runtime/**
      - tools/verify_runtime_release.py
      - tools/build_rail_graph.py
      - tools/build_offline_address_index.py
      - .github/workflows/publish-runtime.yml

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble uploaded runtime ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          if compgen -G 'incoming/HumanRouter_RUNTIME_HOST_v0.4.3.zip.part-*' > /dev/null; then
            cat incoming/HumanRouter_RUNTIME_HOST_v0.4.3.zip.part-* > /tmp/HumanRouter_RUNTIME_HOST_v0.4.3.zip
            echo 'b927bdedfe1fc295f12eac1d83abf039e6bb799bf28f5d92218c91b92ab51dcb  /tmp/HumanRouter_RUNTIME_HOST_v0.4.3.zip' | sha256sum -c -
            rm -rf /tmp/hr-unpack
            mkdir -p /tmp/hr-unpack
            unzip -q /tmp/HumanRouter_RUNTIME_HOST_v0.4.3.zip -d /tmp/hr-unpack
            cp -f /tmp/hr-unpack/HumanRouter_RUNTIME_HOST_v0.4.3/* runtime/
          fi

      - name: Build routeable rail graph with Moscow metro exits
        run: python tools/build_rail_graph.py --manifest manifest.json --root runtime --version moscow-runtime-2026-08-15-r4

      - name: Install pinned OSM address reader
        run: python -m pip install --disable-pip-version-check 'osmium==4.3.1'

      - name: Download verified current Moscow OSM extract
        shell: bash
        run: |
          set -euo pipefail
          base='https://download.bbbike.org/osm/bbbike/Moscow'
          curl --fail --location --retry 4 --retry-delay 4 --output /tmp/CHECKSUM.txt "$base/CHECKSUM.txt"
          expected=$(awk '$2 == "Moscow.osm.pbf" {print $1}' /tmp/CHECKSUM.txt)
          test -n "$expected"
          curl --fail --location --retry 4 --retry-delay 4 --output /tmp/Moscow.osm.pbf "$base/Moscow.osm.pbf"
          printf '%s  %s\n' "$expected" /tmp/Moscow.osm.pbf | md5sum --check -
          echo "OSM_MD5=$expected" >> "$GITHUB_ENV"

      - name: Build verified offline Moscow address pack
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_offline_address_index.py \
            --pbf /tmp/Moscow.osm.pbf \
            --database runtime/address_moscow.sqlite \
            --gzip runtime/address_moscow.sqlite.gz \
            --manifest manifest.json \
            --version moscow-runtime-2026-08-17-address-r1 \
            --source-md5 "$OSM_MD5" \
            --min-addresses 20000 \
            | tee /tmp/address-producer-report.json
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('runtime/address_moscow.sqlite')
          try:
              version, count = db.execute('SELECT schema_version,address_count FROM metadata LIMIT 1').fetchone()
              actual = db.execute('SELECT count(*) FROM addresses').fetchone()[0]
              if version != 1 or count != actual or actual < 20000:
                  raise SystemExit(f'bad address runtime: schema={version} metadata={count} actual={actual}')
              if db.execute("SELECT count(*) FROM addresses WHERE norm_street='тверская'").fetchone()[0] < 3:
                  raise SystemExit('Tverskaya normalization smoke failed')
              if db.execute("SELECT count(*) FROM addresses WHERE norm_street='ленинградский'").fetchone()[0] < 3:
                  raise SystemExit('Leningradsky normalization smoke failed')
              indexes = {row[1] for row in db.execute("PRAGMA index_list('addresses')")}
              if not {'address_street_house', 'address_street_only'}.issubset(indexes):
                  raise SystemExit(f'missing address indexes: {indexes}')
              print(f'address runtime OK: {actual} addresses')
          finally:
              db.close()
          PY
          # Only the gzip pack is a release asset. RuntimeInstaller expands it to address/address.sqlite.
          rm -f runtime/address_moscow.sqlite

      - name: Verify runtime package set
        run: python tools/verify_runtime_release.py --manifest manifest.json --root runtime

      - name: Verify generated rail exit payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          graph = json.loads(gzip.decompress(Path('runtime/rail_graph.json.gz').read_bytes()))
          exits = graph.get('exits', [])
          if not exits:
              raise SystemExit('rail graph contains no Moscow metro exits')
          with_ref = sum(1 for row in exits if row.get('ref'))
          print(f'rail exit payload OK: exits={len(exits)} with_ref={with_ref}')
          PY

      - name: Determine immutable tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=runtime-v0.6.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable and rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
          CURRENT_TAG: runtime-current
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')
          mapfile -t ASSETS < <(find runtime -maxdepth 1 -type f ! -name manifest.json -print | sort)

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Human Router runtime $TAG" --notes "Verified Human Router runtime. Version: $VERSION"
          fi
          gh release upload "$TAG" "${ASSETS[@]}" manifest.json --clobber

          if ! gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release create "$CURRENT_TAG" --title "Human Router current runtime" --notes "Rolling verified runtime channel. Applications should use this tag for automatic data updates."
          fi
          gh release upload "$CURRENT_TAG" "${ASSETS[@]}" manifest.json --clobber
