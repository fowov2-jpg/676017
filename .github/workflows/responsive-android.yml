name: Responsive VremyaHodom Android

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - .github/scripts/android_responsive_smoke.sh
      - .github/scripts/android_tablet_portrait_smoke.sh
      - .github/scripts/android_gps_replay_smoke.sh
      - .github/workflows/responsive-android.yml
  pull_request:
    paths:
      - android/**
      - .github/scripts/android_responsive_smoke.sh
      - .github/scripts/android_tablet_portrait_smoke.sh
      - .github/scripts/android_gps_replay_smoke.sh
      - .github/workflows/responsive-android.yml

concurrency:
  group: responsive-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  responsive-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare stable CI debug signing key
        working-directory: android
        shell: bash
        run: base64 --decode ci-debug.keystore.b64 > ci-debug.keystore

      - name: Build responsive test APKs
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: responsive-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 90

  form-factor-smoke:
    needs: responsive-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - compact-phone
          - compact-phone-large-text
          - tablet-landscape
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: responsive-debug-apk
          path: android-ci

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run responsive viewport ${{ matrix.viewport }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_responsive_smoke.sh android-ci 35 ${{ matrix.viewport }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-responsive-${{ matrix.viewport }}
          path: android/emulator-artifacts/responsive-api-35/${{ matrix.viewport }}
          if-no-files-found: error
          retention-days: 90

  tablet-portrait-smoke:
    needs: responsive-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - ui
          - transit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: responsive-debug-apk
          path: android-ci

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tablet portrait ${{ matrix.group }} shard
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VH_SELECTOR_TIMEOUT_SECONDS: '120'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_tablet_portrait_smoke.sh android-ci 35 ${{ matrix.group }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-responsive-tablet-portrait-${{ matrix.group }}
          path: android/emulator-artifacts/responsive-api-35/tablet-portrait-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 90

  gps-route-replay:
    needs: responsive-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: responsive-debug-apk
          path: android-ci

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Replay passenger GPS through bus and metro transfer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_gps_replay_smoke.sh android-ci 35

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-gps-route-replay
          path: android/emulator-artifacts/gps-route-replay-api-35
          if-no-files-found: error
          retention-days: 90
