name: Build VremyaHodom Android

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - tools/build_surface_runtime.py
      - tools/test_build_surface_runtime.py
      - .github/scripts/android-ui-smoke.sh
      - .github/workflows/android-ui-smoke-release.yml
      - .github/workflows/build-android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Surface runtime integration smoke test
        run: python tools/test_build_surface_runtime.py

      - name: Smoke-check published runtime-current
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/fowov2-jpg/676017/releases/download/runtime-current/'
          mkdir -p /tmp/vremyahodom-runtime-smoke
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 \
            "$BASE/manifest.json" -o /tmp/vremyahodom-runtime-smoke/manifest.json
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/vremyahodom-runtime-smoke')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          packs = [p for p in manifest.get('packs', []) if p.get('required', True)]
          if not packs:
              raise SystemExit('runtime-current manifest has no required packs')

          install_paths = {p.get('install_as', '') for p in packs}
          required_exact = {'surface/manifest.json', 'rail/graph.json'}
          missing = sorted(required_exact - install_paths)
          if missing:
              raise SystemExit(f'missing critical runtime install paths: {missing}')
          if not any(path.startswith('surface/') and path.endswith('.sqlite') for path in install_paths):
              raise SystemExit('runtime-current has no surface SQLite package')
          if not any(str(p.get('file', '')).startswith('walk_') for p in packs):
              raise SystemExit('runtime-current has no pedestrian graph package')

          selected = []
          path_predicates = (
              lambda path: path == 'surface/manifest.json',
              lambda path: path.startswith('surface/') and path.endswith('.sqlite'),
              lambda path: path == 'rail/graph.json',
          )
          for predicate in path_predicates:
              hit = next((p for p in packs if predicate(p.get('install_as', ''))), None)
              if hit and hit not in selected:
                  selected.append(hit)
          walk_hit = next(
              (p for p in packs if str(p.get('file', '')).startswith('walk_manifest')),
              next((p for p in packs if str(p.get('file', '')).startswith('walk_')), None),
          )
          if walk_hit and walk_hit not in selected:
              selected.append(walk_hit)

          base = 'https://github.com/fowov2-jpg/676017/releases/download/runtime-current/'
          for pack in selected:
              target = root / pack['file']
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'curl', '-fL', '--retry', '4', '--retry-delay', '2', '--connect-timeout', '20',
                  base + pack['file'], '-o', str(target)
              ], check=True)
              data = target.read_bytes()
              if len(data) != int(pack['compressed_bytes']):
                  raise SystemExit(f"size mismatch for {pack['file']}")
              digest = hashlib.sha256(data).hexdigest()
              if digest.lower() != pack['sha256_compressed'].lower():
                  raise SystemExit(f"sha256 mismatch for {pack['file']}")

          print(
              f"runtime-current smoke OK: version={manifest.get('version')} "
              f"packs={len(packs)} checked={len(selected)} total={manifest.get('total_download_bytes')}"
          )
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare stable CI debug signing key
        working-directory: android
        shell: bash
        run: base64 --decode ci-debug.keystore.b64 > ci-debug.keystore

      - name: Test, build debug APK and run Android Lint
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK" >/dev/null

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/vremyahodom-badging.txt
          grep -F "application-label:'ВремяХодом'" /tmp/vremyahodom-badging.txt
          grep -F "launchable-activity:" /tmp/vremyahodom-badging.txt

          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Install emulator packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit || true)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: Run release APK in Android API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            PKG=$($AAPT dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
            ACTIVITY=$($AAPT dump badging "$APK" | sed -n "s/^launchable-activity: name='\\([^']*\\)'.*/\\1/p")
            test -n "$PKG"
            test -n "$ACTIVITY"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n "$PKG/$ACTIVITY"
            for i in $(seq 1 30); do
              sleep 2
              if adb shell pidof "$PKG" | grep -Eq '[0-9]'; then
                echo "APK process is running: $PKG"
                adb shell dumpsys activity activities | grep -F "$PKG" | head -n 20 || true
                exit 0
              fi
            done
            echo "APK did not stay running: $PKG" >&2
            adb shell dumpsys package "$PKG" >&2 || true
            adb logcat -d -t 400 >&2 || true
            exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
