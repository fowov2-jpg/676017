name: Build Human Router Android

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - .github/workflows/build-android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Prepare stable CI debug signing key
        working-directory: android
        shell: bash
        run: base64 --decode ci-debug.keystore.b64 > ci-debug.keystore
      - name: Test, build debug APK and run Android Lint
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: human-router-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-router-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
