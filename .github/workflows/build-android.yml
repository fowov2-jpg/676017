name: Build VremyaHodom Android

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - tools/build_surface_runtime.py
      - tools/test_build_surface_runtime.py
      - tools/parse_mtppk_xlsx.py
      - tools/test_parse_mtppk_xlsx.py
      - tools/build_android_rail_timetable.py
      - .github/scripts/android_emulator_smoke.sh
      - .github/workflows/build-android.yml
  pull_request:
    paths:
      - android/**
      - tools/build_surface_runtime.py
      - tools/test_build_surface_runtime.py
      - tools/parse_mtppk_xlsx.py
      - tools/test_parse_mtppk_xlsx.py
      - tools/build_android_rail_timetable.py
      - .github/scripts/android_emulator_smoke.sh
      - .github/workflows/build-android.yml

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Surface runtime integration smoke test
        run: python tools/test_build_surface_runtime.py

      - name: Rail timetable parser and Android asset checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_parse_mtppk_xlsx.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('android/app/src/main/assets/rail_timetable_mtppk_2026-04-27.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema'] == 1
          assert data['source']['url'] == 'https://mtppk.ru/download.php?id=15765'
          assert data['source']['sha256']
          assert data['effective_from'] == '2026-04-27'
          assert len(data['stations']) == 15
          assert len(data['trips']) >= 500
          assert {trip['mode'] for trip in data['trips']} == {'MCD', 'TRAIN'}
          for trip in data['trips']:
              times = [stop[1] for stop in trip['stops']]
              assert len(times) >= 2
              assert times == sorted(times)
              assert max(times) < 48 * 60 * 60
          print(f"rail timetable asset OK: stations={len(data['stations'])} trips={len(data['trips'])}")
          PY

      - name: Smoke-check published runtime-current
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/fowov2-jpg/676017/releases/download/runtime-current/'
          mkdir -p /tmp/vremyahodom-runtime-smoke
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 \
            "$BASE/manifest.json" -o /tmp/vremyahodom-runtime-smoke/manifest.json
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/vremyahodom-runtime-smoke')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          packs = [p for p in manifest.get('packs', []) if p.get('required', True)]
          if not packs:
              raise SystemExit('runtime-current manifest has no required packs')

          install_paths = {p.get('install_as', '') for p in packs}
          required_exact = {'surface/manifest.json', 'rail/graph.json'}
          missing = sorted(required_exact - install_paths)
          if missing:
              raise SystemExit(f'missing critical runtime install paths: {missing}')
          if not any(path.startswith('surface/') and path.endswith('.sqlite') for path in install_paths):
              raise SystemExit('runtime-current has no surface SQLite package')
          if not any(str(p.get('file', '')).startswith('walk_') for p in packs):
              raise SystemExit('runtime-current has no pedestrian graph package')

          selected = []
          path_predicates = (
              lambda path: path == 'surface/manifest.json',
              lambda path: path.startswith('surface/') and path.endswith('.sqlite'),
              lambda path: path == 'rail/graph.json',
          )
          for predicate in path_predicates:
              hit = next((p for p in packs if predicate(p.get('install_as', ''))), None)
              if hit and hit not in selected:
                  selected.append(hit)
          walk_hit = next(
              (p for p in packs if str(p.get('file', '')).startswith('walk_manifest')),
              next((p for p in packs if str(p.get('file', '')).startswith('walk_')), None),
          )
          if walk_hit and walk_hit not in selected:
              selected.append(walk_hit)

          base = 'https://github.com/fowov2-jpg/676017/releases/download/runtime-current/'
          for pack in selected:
              target = root / pack['file']
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'curl', '-fL', '--retry', '4', '--retry-delay', '2', '--connect-timeout', '20',
                  base + pack['file'], '-o', str(target)
              ], check=True)
              data = target.read_bytes()
              if len(data) != int(pack['compressed_bytes']):
                  raise SystemExit(f"size mismatch for {pack['file']}")
              digest = hashlib.sha256(data).hexdigest()
              if digest.lower() != pack['sha256_compressed'].lower():
                  raise SystemExit(f"sha256 mismatch for {pack['file']}")

          print(
              f"runtime-current smoke OK: version={manifest.get('version')} "
              f"packs={len(packs)} checked={len(selected)} total={manifest.get('total_download_bytes')}"
          )
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare stable CI debug signing key
        working-directory: android
        shell: bash
        run: base64 --decode ci-debug.keystore.b64 > ci-debug.keystore

      - name: Test, build app and instrumentation APKs, and run Android Lint
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK" >/dev/null

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/vremyahodom-badging.txt
          grep -F "application-label:'Время ходом'" /tmp/vremyahodom-badging.txt
          grep -F "launchable-activity:" /tmp/vremyahodom-badging.txt
          grep -F "application: label='Время ходом'" /tmp/vremyahodom-badging.txt

          "$AAPT" dump resources "$APK" > /tmp/vremyahodom-resources.txt
          grep -F 'mipmap/ic_launcher' /tmp/vremyahodom-resources.txt
          grep -F 'drawable/ic_launcher_foreground' /tmp/vremyahodom-resources.txt
          unzip -l "$APK" | grep -E 'res/mipmap[^/]*/ic_vremyahodom_logo[^/]*\.webp'

          TEST_APK='android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          test -s "$TEST_APK"
          unzip -tq "$TEST_APK" >/dev/null

          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 90

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API ${{ matrix.api }} instrumentation, smoke and screenshot suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_emulator_smoke.sh android-ci ${{ matrix.api }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vremyahodom-emulator-api-${{ matrix.api }}
          path: android/emulator-artifacts/api-${{ matrix.api }}
          if-no-files-found: error
          retention-days: 90

  publish-qa-release:
    needs: [build, emulator-smoke]
    if: ${{ always() && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vremyahodom-debug-apk
          path: android-ci

      - name: Publish permanent versioned QA APK on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EMULATOR_RESULT: ${{ needs.emulator-smoke.result }}
        run: |
          set -euo pipefail
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          TAG="qa-v${VERSION}"
          APK_SRC=$(find android-ci -type f -name 'app-debug.apk' | head -n 1)
          test -n "$APK_SRC"
          test -s "$APK_SRC"

          APK_OUT="VremyaHodom-${VERSION}-qa.apk"
          SHA_OUT="VremyaHodom-${VERSION}-qa.sha256.txt"
          cp "$APK_SRC" "$APK_OUT"
          sha256sum "$APK_OUT" > "$SHA_OUT"

          cat > release-notes.txt <<EOF
          VremyaHodom QA build ${VERSION}

          Source commit: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_ID}
          Build/unit/lint/APK verification: success
          Emulator smoke aggregate result: ${EMULATOR_RESULT}
          Signing: CI debug signer (QA, not production signing)

          This release is retained in GitHub Releases so a previously shared APK version can be found later.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" "$SHA_OUT" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          else
            gh release create "$TAG" "$APK_OUT" "$SHA_OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "VremyaHodom ${VERSION} · QA" \
              --notes-file release-notes.txt \
              --prerelease
          fi
