name: Audit rail runtime

on:
  push:
    paths:
      - 'tools/rail_runtime_audit.py'
      - '.github/workflows/audit-rail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect rail runtime
        run: python tools/rail_runtime_audit.py
      - name: Upload rail audit
        uses: actions/upload-artifact@v4
        with:
          name: rail-runtime-audit
          path: rail-audit/
          if-no-files-found: error
